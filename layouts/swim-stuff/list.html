
{{ define "main" }}

<div class="post-list">

  {{ range .RegularPages.ByDate.Reverse }}

  <article class="swim-entry">

    <a href="{{ .RelPermalink }}">

      {{ with .Params.cover.image }}
      <img src="{{ . | absURL }}" alt="{{ $.Title }}">
      {{ end }}

      <div class="swim-entry-text">
        <h3>{{ .Title }}</h3>

        {{ with .Params.description }}
        <p>{{ . }}</p>
        {{ end }}

        <span>{{ .Date.Format "2 January 2006" }}</span>
      </div>

    </a>

  </article>

  {{ end }}

</div>

<style>

/* Widen the main content area */

.main:has(.post-list) {
    max-width: 1150px;
}

/* Four-column grid */

.post-list {
    max-width: 100%;
    width: 100%;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 30px 22px;
}

/* Individual story cards */

.swim-entry {
    min-width: 0;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
}

.swim-entry a {
    display: block;
    text-decoration: none;
    color: inherit;
}

/* Thumbnail */

.swim-entry img {
    width: 100%;
    height: 160px;
    object-fit: cover;
    border-radius: 7px;
    margin-bottom: 10px;
}

/* Story title */

.swim-entry-text h3 {
    margin: 0 0 6px 0;
    font-size: 1.05rem;
    line-height: 1.4;
}

/* Description */

.swim-entry-text p {
    margin: 0 0 7px 0;
    font-size: 0.88rem;
    color: var(--secondary);
}

/* Date */

.swim-entry-text span {
    font-size: 0.8rem;
    color: var(--secondary);
}

/* Hover effect */

.swim-entry a:hover h3 {
    color: var(--primary);
}

/* Responsive layout */

@media (max-width: 1000px) {
    .post-list {
        grid-template-columns: repeat(3, minmax(0, 1fr));
    }
}

@media (max-width: 700px) {
    .post-list {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}

@media (max-width: 450px) {
    .post-list {
        grid-template-columns: 1fr;
    }
}

</style>

{{ end }}
